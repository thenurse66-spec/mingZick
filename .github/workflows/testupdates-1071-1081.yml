name: Einmalige Android-Testreleases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/testupdates-1071-1081.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: thenurse66-spec/mingZick
    steps:
      - name: APKs prüfen und veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local line="$1" code="$2" checksum="$3"
            local tag="android-$line-vc$code" file="mingZick-$line.apk"
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/thenurse66-spec/mingZick/74d7b5cb49888ec1378d36ad48a0a693f54640a4/updates/$line/mingZick-$line.1.apk" -o "$file"
            echo "$checksum  $file" | sha256sum -c -
            gh release create "$tag" "$file" --target 74d7b5cb49888ec1378d36ad48a0a693f54640a4 --prerelease --title "mingZick $line.1 – Android-Testupdate" --notes "Testupdate für die Linie $line. SHA-256: $checksum"
          }
          publish 0.10.7 21 84aaf473c311873fd122e8633f921dca34e8cfb0f2cd727700add070ef0c9deb
          publish 0.10.8 22 e7365da2352f6044c8a6da34bb29e7d725bc8d5c6d8ed3ace28909df74528265
